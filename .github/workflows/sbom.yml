name: SBOM and Attestation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix boneset-api

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: DigitalBoneBox-sbom.spdx.json
          upload-artifact: false   # we upload it ourselves below

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalBoneBox-sbom
          path: DigitalBoneBox-sbom.spdx.json
          if-no-files-found: error

      - name: Attest SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: DigitalBoneBox-sbom.spdx.json